name: Test multiple overlays kustomize build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/overlays/overlays/*/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
          max-process: '2'

      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert multiple files were generated
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "files: $FILES"
          echo "Listing output directory:"
          find "$DIRECTORY" -type f
          FILE_COUNT=$(find "$DIRECTORY" -type f -name "*.yaml" | wc -l)
          echo "File count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 generated files (one per overlay), got $FILE_COUNT"
            exit 1
          fi
          echo "PASS: multiple files generated"

      - name: Assert development overlay output contains dev prefix
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          DEV_FILE=$(find "$DIRECTORY" -path "*/development/*" -name "*.yaml" | head -1)
          echo "Development file: $DEV_FILE"
          if [ -z "$DEV_FILE" ]; then
            echo "FAIL: no development overlay output file found"
            exit 1
          fi
          cat "$DEV_FILE"
          if ! grep -q "dev-echoserver" "$DEV_FILE"; then
            echo "FAIL: expected 'dev-echoserver' in development overlay output"
            exit 1
          fi
          echo "PASS: development overlay output contains dev prefix"

      - name: Assert production overlay output contains prod prefix
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          PROD_FILE=$(find "$DIRECTORY" -path "*/production/*" -name "*.yaml" | head -1)
          echo "Production file: $PROD_FILE"
          if [ -z "$PROD_FILE" ]; then
            echo "FAIL: no production overlay output file found"
            exit 1
          fi
          cat "$PROD_FILE"
          if ! grep -q "prod-echoserver" "$PROD_FILE"; then
            echo "FAIL: expected 'prod-echoserver' in production overlay output"
            exit 1
          fi
          echo "PASS: production overlay output contains prod prefix"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
