name: Test write individual files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/simple/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'
          retry-max-attempts: '0'
          retry-wait-ms: '0'

      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert individual files were written (not a single generated.yaml)
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          echo "Listing output directory:"
          find "$DIRECTORY" -type f
          # With write-individual-files=true, files should be named by resource type
          # e.g. apps_v1_deployment_echoserver.yaml instead of generated.yaml
          INDIVIDUAL_FILES=$(find "$DIRECTORY" -type f -name "*.yaml" | grep -v "generated.yaml" | wc -l)
          echo "Individual file count: $INDIVIDUAL_FILES"
          if [ "$INDIVIDUAL_FILES" -lt 1 ]; then
            echo "FAIL: expected individual files to be written"
            exit 1
          fi
          echo "PASS: individual files were written"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
