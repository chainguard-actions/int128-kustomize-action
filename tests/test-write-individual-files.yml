name: Test write-individual-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/simple-app/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'
          retry-max-attempts: '0'

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert individual files were written (no generated.yaml)
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIR" -type f | sort
          # In write-individual-files mode, kustomize writes individual resource files
          # (e.g. apps_v1_deployment_echoserver.yaml) instead of a single generated.yaml
          GENERATED=$(find "$DIR" -name "generated.yaml" | wc -l)
          INDIVIDUAL=$(find "$DIR" -type f -name "*.yaml" | wc -l)
          echo "generated.yaml count: $GENERATED"
          echo "individual yaml count: $INDIVIDUAL"
          if [ "$GENERATED" -gt 0 ]; then
            echo "FAIL: expected no generated.yaml in write-individual-files mode"
            exit 1
          fi
          if [ "$INDIVIDUAL" -lt 1 ]; then
            echo "FAIL: expected at least one individual yaml file"
            exit 1
          fi
          echo "PASS: individual files written correctly"

      - name: Assert files output is non-empty
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert no errors
        env:
          ACTUAL: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no errors but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no errors"
