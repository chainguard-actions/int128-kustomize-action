name: Test write individual files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory output is set"
      - name: Assert individual files are written (no single generated.yaml)
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "output directory: $DIR"
          echo "files: $FILES"
          # With write-individual-files=true, kustomize writes individual resource files
          # There should be no single generated.yaml at the root of the kustomization output dir
          INDIVIDUAL_COUNT=$(find "$DIR" -name "*.yaml" | wc -l)
          echo "total yaml files: $INDIVIDUAL_COUNT"
          if [ "$INDIVIDUAL_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one individual yaml file"
            exit 1
          fi
          echo "PASS: individual yaml files found"
      - name: Assert files output is non-empty
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is non-empty"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
