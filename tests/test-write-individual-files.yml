name: Test write-individual-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/extra-files/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'
      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "actual directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory output is set to $ACTUAL"
      - name: Assert individual files are written (no single generated.yaml)
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Output directory contents:"
          find "$DIR" -type f | sort
          # With write-individual-files=true, kustomize writes individual resource files
          # There should be no single generated.yaml
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          if [ -n "$GENERATED" ]; then
            echo "FAIL: expected no generated.yaml when write-individual-files=true"
            exit 1
          fi
          # There should be individual resource files
          FILE_COUNT=$(find "$DIR" -type f | wc -l)
          echo "Number of output files: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one individual file to be written"
            exit 1
          fi
          echo "PASS: individual files written (no generated.yaml)"
      - name: Assert files output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "actual files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be set"
            exit 1
          fi
          echo "PASS: files output is set"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
