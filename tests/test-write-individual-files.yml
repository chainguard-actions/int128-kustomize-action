name: Test kustomize build with write-individual-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          OS=linux
          ARCH=amd64
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: tests/fixtures/base/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be non-empty"
            exit 1
          fi
          if [ ! -d "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be an existing directory, got: $DIR"
            exit 1
          fi
          echo "PASS: directory output is set and exists"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected 'files' output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert multiple individual files are written
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "Listing output directory recursively: $DIR"
          find "$DIR" -type f | sort
          # With write-individual-files=true, each resource should be a separate file
          # The base kustomization has 2 resources (deployment + service)
          OUTPUT_COUNT=$(find "$DIR" -name "*.yaml" | wc -l)
          echo "Output yaml file count: $OUTPUT_COUNT"
          if [ "$OUTPUT_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 individual yaml files (deployment + service), got $OUTPUT_COUNT"
            exit 1
          fi
          echo "PASS: found $OUTPUT_COUNT individual yaml files as expected"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no raw errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
