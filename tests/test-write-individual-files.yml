name: Test write-individual-files option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/simple/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert individual files were written (not a single generated.yaml)
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          echo "Listing output directory:"
          find "$DIRECTORY" -type f | sort
          # With write-individual-files=true, kustomize writes individual resource files
          # There should be no single generated.yaml; instead individual resource files
          INDIVIDUAL_COUNT=$(find "$DIRECTORY" -name "*.yaml" | wc -l)
          echo "yaml file count: $INDIVIDUAL_COUNT"
          if [ "$INDIVIDUAL_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 individual yaml file"
            exit 1
          fi
          echo "PASS: found $INDIVIDUAL_COUNT individual yaml file(s)"
      - name: Assert files output is set
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected files output to be set"
            exit 1
          fi
          echo "PASS: files output is set"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
