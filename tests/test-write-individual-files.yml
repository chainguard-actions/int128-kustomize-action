name: Test write-individual-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/individual/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          write-individual-files: 'true'

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert no single generated.yaml (individual files mode)
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Checking output directory: $DIR"
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "generated.yaml found: $GENERATED"
          if [ -n "$GENERATED" ]; then
            echo "FAIL: expected no generated.yaml in write-individual-files mode"
            exit 1
          fi
          echo "PASS: no generated.yaml found (individual files mode)"

      - name: Assert multiple individual files were written
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory: $DIR"
          find "$DIR" -type f | sort
          COUNT=$(find "$DIR" -type f -name "*.yaml" | wc -l)
          echo "yaml file count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 individual yaml files, got $COUNT"
            exit 1
          fi
          echo "PASS: $COUNT individual yaml files found"

      - name: Assert files output lists multiple files
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $ACTUAL"
          LINE_COUNT=$(echo "$ACTUAL" | grep -c "\.yaml" || true)
          echo "yaml file lines: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 files in output, got $LINE_COUNT"
            exit 1
          fi
          echo "PASS: files output lists $LINE_COUNT files"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
