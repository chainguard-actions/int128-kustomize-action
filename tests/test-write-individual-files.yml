name: Test write-individual-files mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_SERVER_URL: https://github.com
      GITHUB_REPOSITORY: test-owner/test-repo
      RUNNER_TEMP: /tmp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/overlays/development/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          write-individual-files: 'true'

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "actual directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert files output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "actual files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert individual files exist on disk
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory: $DIR"
          find "$DIR" -type f
          COUNT=$(find "$DIR" -type f | wc -l)
          echo "File count: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one individual file in $DIR"
            exit 1
          fi
          # In individual-files mode, files should NOT be named generated.yaml
          if find "$DIR" -name "generated.yaml" | grep -q .; then
            echo "FAIL: found generated.yaml in individual-files mode; expected individual resource files"
            exit 1
          fi
          echo "PASS: individual files found (no generated.yaml)"
