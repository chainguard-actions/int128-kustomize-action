name: Test write-individual-files mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          write-individual-files: 'true'

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          if [ ! -d "$DIR" ]; then
            echo "FAIL: directory '$DIR' does not exist"
            exit 1
          fi
          echo "PASS: directory output is set and exists"

      - name: Assert individual files are written (not generated.yaml)
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          echo "Listing output directory:"
          find "$DIR" -type f
          # In write-individual-files mode, kustomize writes individual resource files
          # There should be no single generated.yaml at the top level of the kustomization dir
          # Instead, individual resource files are written
          FILE_COUNT=$(find "$DIR" -type f | wc -l)
          echo "total file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one output file in write-individual-files mode"
            exit 1
          fi
          echo "PASS: individual files written, count=$FILE_COUNT"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
