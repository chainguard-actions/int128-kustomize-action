name: Test kustomize build error fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: bash tests/fixtures/install-kustomize.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          kustomization: tests/fixtures/kustomize/broken/kustomization.yaml
          retry-max-attempts: "0"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "outcome: $OUTCOME"
          echo "raw-errors: $RAW_ERRORS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"; exit 1
          fi
          if [ -z "$RAW_ERRORS" ]; then
            echo "FAIL: expected raw-errors to be set before failing"; exit 1
          fi
          echo "PASS"
