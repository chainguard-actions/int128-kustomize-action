name: Test multiple kustomizations in parallel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/overlays/*/kustomization.yaml
          base-directory: ${{ github.workspace }}
          max-process: '2'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert multiple generated files exist
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "files: $FILES"
          echo "Listing output directory:"
          find "$DIRECTORY" -type f | sort
          # Count generated.yaml files - should be at least 2 (development + production)
          COUNT=$(find "$DIRECTORY" -name "generated.yaml" | wc -l)
          echo "generated.yaml count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 generated.yaml files (one per overlay), got $COUNT"
            exit 1
          fi
          echo "PASS: found $COUNT generated.yaml files"
      - name: Assert files output contains multiple entries
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          LINE_COUNT=$(echo "$FILES" | grep -c "generated.yaml" || true)
          echo "line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 files in output, got $LINE_COUNT"
            exit 1
          fi
          echo "PASS: files output has $LINE_COUNT entries"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
