name: Test kustomize build with extra args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: ${{ github.workspace }}/tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
          kustomize-build-args: |
            --load-restrictor=LoadRestrictionsNone

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set to '$DIR'"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected 'files' output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert generated file contains Deployment
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          FIRST_FILE=$(echo "$FILES" | head -n1)
          echo "first file: $FIRST_FILE"
          if [ ! -f "$FIRST_FILE" ]; then
            echo "FAIL: generated file does not exist: $FIRST_FILE"
            exit 1
          fi
          if ! grep -q "kind: Deployment" "$FIRST_FILE"; then
            echo "FAIL: generated file does not contain 'kind: Deployment'"
            cat "$FIRST_FILE"
            exit 1
          fi
          echo "PASS: generated file exists and contains Deployment"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
