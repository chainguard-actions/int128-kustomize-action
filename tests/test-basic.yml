name: Test basic kustomize build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/simple/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert files output is set
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected files output to be set"
            exit 1
          fi
          echo "PASS: files output is set"
      - name: Assert generated file exists
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Looking for generated.yaml under $DIRECTORY"
          GENERATED=$(find "$DIRECTORY" -name "generated.yaml" | head -1)
          echo "found: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to exist in output directory"
            exit 1
          fi
          echo "PASS: generated.yaml found at $GENERATED"
      - name: Assert generated file contains Deployment
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          GENERATED=$(find "$DIRECTORY" -name "generated.yaml" | head -1)
          if ! grep -q "kind: Deployment" "$GENERATED"; then
            echo "FAIL: expected generated.yaml to contain 'kind: Deployment'"
            cat "$GENERATED"
            exit 1
          fi
          echo "PASS: generated.yaml contains Deployment"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
