name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          if [ ! -d "$DIR" ]; then
            echo "FAIL: directory '$DIR' does not exist"
            exit 1
          fi
          echo "PASS: directory output is set and exists"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert generated.yaml exists in output directory
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIR" -type f
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to exist in output directory"
            exit 1
          fi
          echo "PASS: generated.yaml found at $GENERATED"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
          PRETTY_ERRORS: ${{ steps.kustomize.outputs.pretty-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          echo "pretty-errors: $PRETTY_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no raw errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
