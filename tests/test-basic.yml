name: Test basic kustomize build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "actual directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory output is set to $ACTUAL"
      - name: Assert files output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "actual files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be set"
            exit 1
          fi
          echo "PASS: files output is set"
      - name: Assert generated.yaml exists in output directory
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Looking for generated.yaml under: $DIR"
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "Found: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to exist in output directory"
            exit 1
          fi
          echo "PASS: generated.yaml found at $GENERATED"
      - name: Assert generated.yaml contains ConfigMap
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "Content of $GENERATED:"
          cat "$GENERATED"
          if ! grep -q "kind: ConfigMap" "$GENERATED"; then
            echo "FAIL: expected ConfigMap in generated.yaml"
            exit 1
          fi
          echo "PASS: ConfigMap found in generated.yaml"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
