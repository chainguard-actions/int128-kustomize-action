name: Test parallel kustomize builds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: |
            tests/fixtures/simple-app/kustomization.yaml
            tests/fixtures/another-app/kustomization.yaml
          base-directory: ${{ github.workspace }}
          max-process: '2'
          retry-max-attempts: '0'

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert multiple files were generated
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "files output: $FILES"
          echo "Listing output directory:"
          find "$DIR" -type f | sort
          COUNT=$(find "$DIR" -name "generated.yaml" | wc -l)
          echo "generated.yaml count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 generated.yaml files (one per kustomization), got $COUNT"
            exit 1
          fi
          echo "PASS: multiple kustomizations built in parallel"

      - name: Assert no errors
        env:
          ACTUAL: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no errors but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no errors"
