name: Test kustomize error causes action failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: kustomize
        uses: .
        continue-on-error: true
        with:
          kustomization: tests/fixtures/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          ignore-kustomize-error: 'false'

      - name: Assert action failed due to kustomize error
        env:
          OUTCOME: ${{ steps.kustomize.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for broken kustomization with ignore-kustomize-error=false, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for broken kustomization"
