name: Test kustomize-build-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/simple/kustomization.yaml
          base-directory: ${{ github.workspace }}
          kustomize-build-args: --load-restrictor=LoadRestrictionsNone
          retry-max-attempts: '0'
          retry-wait-ms: '0'

      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert directory exists
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ ! -d "$DIRECTORY" ]; then
            echo "FAIL: expected directory to exist: $DIRECTORY"
            exit 1
          fi
          echo "PASS: directory exists"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert generated file contains Deployment
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIRECTORY" -type f
          GENERATED=$(find "$DIRECTORY" -type f -name "*.yaml" | head -1)
          if [ -z "$GENERATED" ]; then
            echo "FAIL: no yaml files found in output directory"
            exit 1
          fi
          echo "Generated file: $GENERATED"
          cat "$GENERATED"
          if ! grep -q "kind: Deployment" "$GENERATED"; then
            echo "FAIL: expected 'kind: Deployment' in generated file"
            exit 1
          fi
          echo "PASS: generated file contains Deployment"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
