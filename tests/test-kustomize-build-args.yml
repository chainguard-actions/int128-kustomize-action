name: Test kustomize-build-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/basic/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          kustomize-build-args: --load-restrictor LoadRestrictionsNone

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert files output is set
        env:
          ACTUAL: ${{ steps.kustomize.outputs.files }}
        run: |
          echo "files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert generated.yaml exists in output directory
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Looking for generated.yaml under: $DIR"
          FOUND=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: expected generated.yaml to exist in output directory"
            exit 1
          fi
          echo "PASS: generated.yaml found"

      - name: Assert generated.yaml contains Deployment
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          FOUND=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "Checking content of: $FOUND"
          if ! grep -q "kind: Deployment" "$FOUND"; then
            echo "FAIL: expected generated.yaml to contain 'kind: Deployment'"
            cat "$FOUND"
            exit 1
          fi
          echo "PASS: generated.yaml contains Deployment"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
