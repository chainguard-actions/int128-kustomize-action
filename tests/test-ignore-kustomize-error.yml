name: Test ignore-kustomize-error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          ignore-kustomize-error: 'true'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert action succeeded despite kustomize error
        run: |
          echo "PASS: action completed without failing the step"
      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set even on error"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert raw-errors output is populated
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -z "$RAW_ERRORS" ]; then
            echo "FAIL: expected raw-errors to be populated when kustomize fails"
            exit 1
          fi
          echo "PASS: raw-errors is populated"
      - name: Assert pretty-errors output is populated
        env:
          PRETTY_ERRORS: ${{ steps.kustomize.outputs.pretty-errors }}
        run: |
          echo "pretty-errors: $PRETTY_ERRORS"
          if [ -z "$PRETTY_ERRORS" ]; then
            echo "FAIL: expected pretty-errors to be populated when kustomize fails"
            exit 1
          fi
          echo "PASS: pretty-errors is populated"
