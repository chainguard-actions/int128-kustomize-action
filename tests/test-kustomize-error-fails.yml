name: Test kustomize error causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        continue-on-error: true
        with:
          kustomization: tests/fixtures/invalid/kustomization.yaml
          base-directory: ${{ github.workspace }}
          ignore-kustomize-error: 'false'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.kustomize.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid kustomization but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid kustomization"
