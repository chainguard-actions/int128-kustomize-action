name: Test kustomize error propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        continue-on-error: true
        with:
          kustomization: tests/fixtures/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          ignore-kustomize-error: 'false'
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert action failed when kustomize errors and ignore-kustomize-error is false
        env:
          OUTCOME: ${{ steps.kustomize.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when kustomize errors and ignore-kustomize-error=false, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when kustomize encountered an error"
