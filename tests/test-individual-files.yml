name: Test write individual files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: ${{ github.workspace }}/tests/fixtures/individual/kustomization.yaml
          base-directory: ${{ github.workspace }}
          write-individual-files: 'true'

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set to '$DIR'"

      - name: Assert multiple files are generated (individual files mode)
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected 'files' output to be non-empty"
            exit 1
          fi
          FILE_COUNT=$(echo "$FILES" | wc -l | tr -d ' ')
          echo "file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "FAIL: expected at least 2 individual files but got $FILE_COUNT"
            exit 1
          fi
          echo "PASS: $FILE_COUNT individual files generated"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"

      - name: Assert generated files contain expected resources
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          FOUND_DEPLOYMENT=false
          FOUND_SERVICE=false
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              if grep -q "kind: Deployment" "$f"; then
                FOUND_DEPLOYMENT=true
              fi
              if grep -q "kind: Service" "$f"; then
                FOUND_SERVICE=true
              fi
            fi
          done <<< "$FILES"
          if [ "$FOUND_DEPLOYMENT" != "true" ]; then
            echo "FAIL: no generated file contains 'kind: Deployment'"
            exit 1
          fi
          if [ "$FOUND_SERVICE" != "true" ]; then
            echo "FAIL: no generated file contains 'kind: Service'"
            exit 1
          fi
          echo "PASS: both Deployment and Service found in generated files"
