name: Test extra files copy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: ${{ github.workspace }}/tests/fixtures/with-extra/kustomization.yaml
          extra-files: ${{ github.workspace }}/tests/fixtures/with-extra/config.txt
          base-directory: ${{ github.workspace }}

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.action.outputs.directory }}
        run: |
          echo "actual directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert files output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.files }}
        run: |
          echo "actual files: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected files output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert extra file exists in output directory
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "Looking for config.txt under: $DIR"
          FOUND=$(find "$DIR" -name "config.txt" | head -1)
          echo "Found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: expected config.txt to be copied into output directory"
            exit 1
          fi
          echo "PASS: config.txt found in output directory"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no raw errors"
            exit 1
          fi
          echo "PASS: no errors"
