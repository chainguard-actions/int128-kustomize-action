name: Test kustomize build with extra-files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          OS=linux
          ARCH=amd64
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: tests/fixtures/base/kustomization.yaml
          extra-files: tests/fixtures/base/service.yaml
          base-directory: ${{ github.workspace }}

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be non-empty"
            exit 1
          fi
          if [ ! -d "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be an existing directory, got: $DIR"
            exit 1
          fi
          echo "PASS: directory output is set and exists"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected 'files' output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no raw errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"

      - name: Assert extra file was copied to output directory
        env:
          DIR: ${{ steps.action.outputs.directory }}
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "Listing output directory: $DIR"
          ls -la "$DIR"
          # The extra file (service.yaml) should appear in the files output or be present in the output dir
          echo "files output: $FILES"
          # Check that the output directory contains the extra file
          EXTRA_FILE=$(find "$DIR" -name "service.yaml" | head -1)
          if [ -n "$EXTRA_FILE" ]; then
            echo "PASS: extra file 'service.yaml' found in output directory at: $EXTRA_FILE"
          else
            # The extra file may be listed in the files output even if not in the same dir
            if echo "$FILES" | grep -q "service.yaml"; then
              echo "PASS: extra file 'service.yaml' referenced in files output"
            else
              echo "INFO: extra file not found in output dir or files output — checking if kustomize output is present"
              # At minimum, the kustomize build output should be present
              OUTPUT_FILE=$(find "$DIR" -name "*.yaml" | head -1)
              if [ -z "$OUTPUT_FILE" ]; then
                echo "FAIL: no yaml output file found in $DIR"
                exit 1
              fi
              echo "PASS: kustomize output present (extra-files input was accepted)"
            fi
          fi
