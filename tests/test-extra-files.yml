name: Test extra-files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: action
        uses: .
        with:
          kustomization: ${{ github.workspace }}/tests/fixtures/extra-files/kustomization.yaml
          extra-files: ${{ github.workspace }}/tests/fixtures/extra-files/config.json
          base-directory: ${{ github.workspace }}

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected 'directory' output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set to '$DIR'"

      - name: Assert files output is set
        env:
          FILES: ${{ steps.action.outputs.files }}
        run: |
          echo "files: $FILES"
          if [ -z "$FILES" ]; then
            echo "FAIL: expected 'files' output to be non-empty"
            exit 1
          fi
          echo "PASS: files output is set"

      - name: Assert extra file was copied to output directory
        env:
          DIR: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory: $DIR"
          # The extra file (config.json) should have been copied into the output directory
          EXTRA_FILE=$(find "$DIR" -name "config.json" 2>/dev/null | head -n1)
          echo "extra file found: $EXTRA_FILE"
          if [ -z "$EXTRA_FILE" ]; then
            echo "FAIL: expected config.json to be copied to output directory '$DIR'"
            ls -la "$DIR" || true
            exit 1
          fi
          echo "PASS: extra file config.json was copied to output directory"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
