name: Test extra-files feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/with-extras/kustomization.yaml
          extra-files: tests/fixtures/with-extras/metadata.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'

      - name: Assert directory output is set
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          if [ ! -d "$DIR" ]; then
            echo "FAIL: directory '$DIR' does not exist"
            exit 1
          fi
          echo "PASS: directory output is set and exists"

      - name: Assert generated.yaml exists
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          GENERATED=$(find "$DIR" -name "generated.yaml" | head -1)
          echo "generated.yaml: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to exist"
            exit 1
          fi
          echo "PASS: generated.yaml found"

      - name: Assert extra file (metadata.yaml) was copied
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIR" -type f
          METADATA=$(find "$DIR" -name "metadata.yaml" | head -1)
          echo "metadata.yaml: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata.yaml to be copied to output directory"
            exit 1
          fi
          echo "PASS: metadata.yaml was copied to output directory"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
