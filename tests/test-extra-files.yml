name: Test extra files copy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/with-extra/kustomization.yaml
          extra-files: tests/fixtures/with-extra/metadata.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'

      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert extra file was copied to output directory
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIRECTORY" -type f
          EXTRA_FILE=$(find "$DIRECTORY" -name "metadata.yaml" | head -1)
          echo "Extra file: $EXTRA_FILE"
          if [ -z "$EXTRA_FILE" ]; then
            echo "FAIL: expected metadata.yaml to be copied to output directory"
            exit 1
          fi
          cat "$EXTRA_FILE"
          if ! grep -q "environment: staging" "$EXTRA_FILE"; then
            echo "FAIL: expected 'environment: staging' in copied metadata.yaml"
            exit 1
          fi
          echo "PASS: extra file was copied to output directory"

      - name: Assert generated manifest is also present
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          GENERATED=$(find "$DIRECTORY" -name "generated.yaml" | head -1)
          echo "Generated file: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to be present in output directory"
            exit 1
          fi
          echo "PASS: generated manifest is present"

      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
