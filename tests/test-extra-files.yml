name: Test extra-files copy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/with-extra/kustomization.yaml
          extra-files: tests/fixtures/with-extra/metadata.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert directory output is set
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert generated.yaml exists
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIRECTORY" -type f | sort
          GENERATED=$(find "$DIRECTORY" -name "generated.yaml" | head -1)
          echo "generated: $GENERATED"
          if [ -z "$GENERATED" ]; then
            echo "FAIL: expected generated.yaml to exist"
            exit 1
          fi
          echo "PASS: generated.yaml found"
      - name: Assert extra file was copied
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "Listing output directory:"
          find "$DIRECTORY" -type f | sort
          EXTRA=$(find "$DIRECTORY" -name "metadata.yaml" | head -1)
          echo "extra file: $EXTRA"
          if [ -z "$EXTRA" ]; then
            echo "FAIL: expected metadata.yaml to be copied to output directory"
            exit 1
          fi
          echo "PASS: metadata.yaml was copied to $EXTRA"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
