name: Test ignore-kustomize-error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      - id: kustomize
        uses: .
        with:
          kustomization: tests/fixtures/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          ignore-kustomize-error: 'true'

      - name: Assert action succeeded despite kustomize error
        run: |
          echo "Action completed successfully (ignore-kustomize-error=true)"
          echo "PASS: action did not fail despite broken kustomization"

      - name: Assert raw-errors output is set
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -z "$RAW_ERRORS" ]; then
            echo "FAIL: expected raw-errors to be non-empty for broken kustomization"
            exit 1
          fi
          echo "PASS: raw-errors is set as expected"

      - name: Assert pretty-errors output is set
        env:
          PRETTY_ERRORS: ${{ steps.kustomize.outputs.pretty-errors }}
        run: |
          echo "pretty-errors: $PRETTY_ERRORS"
          if [ -z "$PRETTY_ERRORS" ]; then
            echo "FAIL: expected pretty-errors to be non-empty for broken kustomization"
            exit 1
          fi
          echo "PASS: pretty-errors is set as expected"

      - name: Assert directory output is still set
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected directory output to be set even on error"
            exit 1
          fi
          echo "PASS: directory output is set"
