name: Test ignore-kustomize-error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          OS=linux
          ARCH=amd64
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        env:
          RUNNER_TEMP: /tmp
        with:
          kustomization: tests/fixtures/overlays/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
          max-process: '1'
          ignore-kustomize-error: 'true'
      - name: Assert directory output is set
        env:
          DIR: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected directory output to be set even on error"
            exit 1
          fi
          echo "PASS: directory output is set"
      - name: Assert raw-errors output is set
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -z "$RAW_ERRORS" ]; then
            echo "FAIL: expected raw-errors to be non-empty for broken kustomization"
            exit 1
          fi
          echo "PASS: raw-errors is set"
      - name: Assert pretty-errors output is set
        env:
          PRETTY_ERRORS: ${{ steps.kustomize.outputs.pretty-errors }}
        run: |
          echo "pretty-errors: $PRETTY_ERRORS"
          if [ -z "$PRETTY_ERRORS" ]; then
            echo "FAIL: expected pretty-errors to be non-empty for broken kustomization"
            exit 1
          fi
          echo "PASS: pretty-errors is set"
