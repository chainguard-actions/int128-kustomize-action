name: Test ignore-kustomize-error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: bash tests/fixtures/install-kustomize.sh
      - id: action
        uses: .
        with:
          kustomization: |
            tests/fixtures/kustomize/broken/kustomization.yaml
            tests/fixtures/kustomize/ok/app1/kustomization.yaml
          ignore-kustomize-error: "true"
          retry-max-attempts: "0"
      - name: Assert errors reported but action succeeded
        env:
          DIR: ${{ steps.action.outputs.directory }}
          RAW_ERRORS: ${{ steps.action.outputs.raw-errors }}
          PRETTY_ERRORS: ${{ steps.action.outputs.pretty-errors }}
        run: |
          echo "directory: $DIR"
          echo "raw-errors: $RAW_ERRORS"
          echo "pretty-errors: $PRETTY_ERRORS"
          if [ -z "$RAW_ERRORS" ]; then echo "FAIL: raw-errors empty"; exit 1; fi
          if [ -z "$PRETTY_ERRORS" ]; then echo "FAIL: pretty-errors empty"; exit 1; fi
          echo "$PRETTY_ERRORS" | grep -q "broken" || { echo "FAIL: pretty-errors does not mention broken kustomization"; exit 1; }
          if [ ! -f "$DIR/tests/fixtures/kustomize/ok/app1/generated.yaml" ]; then
            echo "FAIL: successful kustomization output missing"; exit 1
          fi
          echo "PASS"
