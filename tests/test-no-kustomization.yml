name: Test no kustomization pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        with:
          # No kustomization input - should succeed with empty results
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
      - name: Assert action succeeded with no kustomization
        run: |
          echo "PASS: action completed without failing"
      - name: Assert directory output is set even with no kustomizations
        env:
          DIRECTORY: ${{ steps.kustomize.outputs.directory }}
        run: |
          echo "directory: $DIRECTORY"
          if [ -z "$DIRECTORY" ]; then
            echo "FAIL: expected directory output to be set even with no kustomizations"
            exit 1
          fi
          echo "PASS: directory is set to $DIRECTORY"
      - name: Assert no errors
        env:
          RAW_ERRORS: ${{ steps.kustomize.outputs.raw-errors }}
        run: |
          echo "raw-errors: $RAW_ERRORS"
          if [ -n "$RAW_ERRORS" ]; then
            echo "FAIL: expected no errors but got: $RAW_ERRORS"
            exit 1
          fi
          echo "PASS: no errors"
