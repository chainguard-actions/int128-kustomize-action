name: Test kustomize error fails action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION=5.4.3
          OS=linux
          ARCH=amd64
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version
      - id: kustomize
        uses: .
        continue-on-error: true
        env:
          RUNNER_TEMP: /tmp
        with:
          kustomization: tests/fixtures/overlays/broken/kustomization.yaml
          base-directory: ${{ github.workspace }}
          retry-max-attempts: '0'
          retry-wait-ms: '0'
          max-process: '1'
          ignore-kustomize-error: 'false'
      - name: Assert action failed due to kustomize error
        env:
          OUTCOME: ${{ steps.kustomize.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when kustomize encounters an error"
            exit 1
          fi
          echo "PASS: action correctly failed on kustomize error"
